[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armodel"
dynamic = ["version"]
description = "the python arxml parser"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "melodypapa", email = "melodypapa@outlook.com"},
]
keywords = ["AUTOSAR", "ARXML"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "colorama",
    "openpyxl",
    "lxml",
]

[project.optional-dependencies]
pytest = ["pytest>=7.0", "pytest-cov>=4.0", "pyyaml>=6.0"]
lint = ["ruff", "black", "mypy"]

[project.urls]
Homepage = "http://github.com/melodypapa/py-armodel"

[project.scripts]
format-xml = "armodel.cli.format_xml_cli:main"
arxml-dump = "armodel.cli.arxml_dump_cli:cli_main"
arxml-format = "armodel.cli.arxml_format_cli:main"
connector2xlsx = "armodel.cli.connector2xlsx_cli:main"
connector-update = "armodel.cli.connector_update_cli:main"
armodel-component = "armodel.cli.swc_list_cli:main"
armodel-system-signal = "armodel.cli.system_signal_cli:main"
armodel-memory-section = "armodel.cli.memory_section_cli:main"
armodel-file-list = "armodel.cli.file_list_cli:main"
armodel-uuid-checker = "armodel.cli.uuid_checker_cli:main"
os-ecuc-export = "armodel.cli.os_config_export_cli:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "armodel.__version__"}

[tool.coverage.run]
branch = true
source = ["armodel"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 200
target-version = ["py38"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | htmlcov
)/
'''

[tool.ruff]
line-length = 200
target-version = "py38"
extend-exclude = ["build", ".venv", "htmlcov", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The AUTOSAR model package relies on deliberate (non-alphabetical) import
# ordering to avoid circular imports during package initialization. Sorting
# these imports (I001) breaks that ordering and triggers ImportError at load
# time, so isort is disabled for the model tree.
"src/armodel/models/**" = ["I001"]
# The ARXML writer imports model types in a deliberate order to match the parser's
# expectations, so import sorting (I001) and E402 checks are disabled.
"src/armodel/writer/arxml_writer.py" = ["I001", "E402"]
# The ARXML parser similarly uses deliberate import ordering.
"src/armodel/parser/arxml_parser.py" = ["I001", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["armodel"]
force-single-line = false

[tool.mypy]
files = ["src/armodel"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true

# Legacy modules with pre-existing type debt (mypy gradual adoption baseline):
# bodies are fully analyzed but reported errors are suppressed. Drain by fixing
# a module's errors and deleting its entry; new modules must NOT be added.
[[tool.mypy.overrides]]
module = [
    "armodel.cli.arxml_dump_cli",
    "armodel.models.M2.AUTOSARTemplates.AutosarTopLevelStructure",
    "armodel.models.M2.AUTOSARTemplates.BswModuleTemplate.BswBehavior",
    "armodel.models.M2.AUTOSARTemplates.CommonStructure.ResourceConsumption",
    "armodel.models.M2.AUTOSARTemplates.CommonStructure.ServiceNeeds",
    "armodel.models.M2.AUTOSARTemplates.ECUCParameterDefTemplate",
    "armodel.models.M2.AUTOSARTemplates.GenericStructure.GeneralTemplateClasses.ARPackage",
    "armodel.models.M2.AUTOSARTemplates.SWComponentTemplate.Components",
    "armodel.models.M2.AUTOSARTemplates.SWComponentTemplate.PortInterface",
    "armodel.models.M2.AUTOSARTemplates.SWComponentTemplate.SwcInternalBehavior",
    "armodel.models.M2.AUTOSARTemplates.SWComponentTemplate.SwcInternalBehavior.ServiceMapping",
    "armodel.models.M2.AUTOSARTemplates.SystemTemplate",
    "armodel.models.M2.AUTOSARTemplates.SystemTemplate.Fibex.FibexCore.CoreTopology",
    "armodel.models.M2.MSR.AsamHdo.ComputationMethod",
    "armodel.parser.abstract_arxml_parser",
    "armodel.parser.arxml_parser",
    "armodel.parser.connector_xlsx_parser",
    "armodel.parser.ecuc_parser",
    "armodel.parser.os_ecuc_parser",
    "armodel.report.connector_xls_report",
    "armodel.writer.abstract_arxml_writer",
    "armodel.writer.arxml_writer",
]
ignore_errors = true
