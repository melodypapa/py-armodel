OsApplication:
- name: OsApplication_QM
  OsTrusted: false
  OsAppAlarmRef:
  - /Os/Os/AlarmIncrementRteCounter
  OsAppCounterRef:
  - /Os/Os/HwCounter
  - /Os/Os/Rte_Counter
  OsAppTaskRef:
  - Init_Task
  - Rte_Event_Task
  - Rte_Time_Task
  - SchMDiagStateTask_20ms
  OsAppStartupHook: false
  OsAppErrorHook: false
  OsAppShutdownHook: false
  ApplicationState: APPLICATION_ACCESSIBLE
OsTask:
- name: Init_Task
  OsTaskActivation: 1
  OsTaskPriority: 127
  OsTaskSchedule: NON
  OsStacksize: 1024
  OsTaskAccessingApplication:
  - OsApplication_QM
  OsTaskAppModeRef:
  - /Os/Os/OSDEFAULTAPPMODE
- name: Rte_Time_Task
  OsTaskActivation: 1
  OsTaskPriority: 52
  OsTaskSchedule: FULL
  OsStacksize: 1024
  OsTaskAccessingApplication:
  - OsApplication_QM
- name: Rte_Event_Task
  OsTaskActivation: 1
  OsTaskPriority: 51
  OsTaskSchedule: FULL
  OsStacksize: 1024
  OsTaskAccessingApplication:
  - OsApplication_QM
  OsTaskEventRef:
  - /Os/Os/Rte_OSShutdownEvent
  - /Os/Os/Rte_OSTriggerExecutableEvent_Rte_Event_Task_DRE_523E8C37B43C9473DFA14A98BC1F65F2
  - /Os/Os/Rte_OSTriggerExecutableEvent_Rte_Event_Task_MSE_4FF9241E67DF8B0AADC83685D425BB32
- name: SchMDiagStateTask_20ms
  OsTaskActivation: 1
  OsTaskPriority: 50
  OsTaskSchedule: FULL
  OsStacksize: 512
  OsTaskAccessingApplication:
  - OsApplication_QM
OsAlarm:
- name: AlarmSetRteShutdownEvent
  OsAlarmCounterRef: /Os/Os/Rte_Counter
  OsAlarmSetEventTaskRef: /Os/Os/Rte_Event_Task
  OsAlarmSetEventRef: /Os/Os/Rte_OSShutdownEvent
- name: AlarmIncrementRteCounter
  OsAlarmCounterRef: /Os/Os/HwCounter
  OsAlarmIncrementCounterRef: /Os/Os/Rte_Counter
  OsAlarmAlarmTime: 1
  OsAlarmAutostartType: RELATIVE
  OsAlarmCycleTime: 1
  OsAlarmAppModeRef: /Os/Os/OSDEFAULTAPPMODE
OsIsr:
- name: CanIsr
  OsIsrCategory: CATEGORY_2
  OsIsrPeriod: 0.005
  OsIsrExecutionBudget: 0.001
  OsIsrTimeFrame: 0.02
  OsIsrResourceLockBudget:
  - 0.0005
  OsIsrResourceLockResourceRef:
  - /Os/Os/OsStackResource
OsScheduleTable:
- name: SystemScheduleTable
  OsScheduleTableCounterRef: /Os/Os/HwCounter
  OsScheduleTableDuration: 10
  OsScheduleTableRepeating: true
  OsScheduleTableAutostartType: RELATIVE
  OsScheduleTableStartValue: 0
  OsScheduleTableAppModeRef: /Os/Os/OSDEFAULTAPPMODE
  OsScheduleTableSyncStrategy: IMPLICIT
  OsScheduleTableExpiryPoint:
  - OsScheduleTblExpPointOffset: 2
    OsScheduleTableActivateTaskRef: /Os/Os/Rte_Time_Task
  - OsScheduleTblExpPointOffset: 5
    OsScheduleTableMaxShorten: 1
    OsScheduleTableMaxLengthen: 1
    OsScheduleTableSetEventTaskRef: /Os/Os/Rte_Event_Task
    OsScheduleTableSetEventRef: /Os/Os/Rte_OSShutdownEvent
